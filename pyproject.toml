[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-remote-stack"
version = "0.1.0.dev0"
description = "Reproducible deployment and operations package for McRemote servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.26,<5",
    "PyYAML>=6.0.2,<7",
    "rfc8785>=0.1.4,<0.2",
    "tomlkit>=0.15.1,<0.16",
]

[project.scripts]
mcrctl = "mc_remote_stack.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
    "setuptools>=77",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mc_remote_stack = [
    "assets/*.sh",
    "data/*.toml",
    "data/profiles/*/*/*.toml",
    "data/preset_registry/*/*/*.toml",
    "data/compatibility/records/*.toml",
    "data/schemas/*.json",
]
