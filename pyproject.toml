[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-remote-stack"
version = "0.1.0.dev0"
description = "Reproducible deployment and operations package for McRemote servers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.26,<5",
    "PyYAML>=6.0.2,<7",
    "rfc8785>=0.1.4,<0.2",
    "tomlkit>=0.15.1,<0.16",
]

[project.scripts]
mcrctl = "mc_remote_stack.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
    "setuptools>=77",
]

[tool.uv]
# Use the OS Python so Ubuntu security updates reach it; .python-version pins the minor.
python-preference = "system"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mc_remote_stack = [
    "data/*.toml",
    "data/release-manifest-lock.json",
    "data/profiles/*/*/*.toml",
    "data/preset_registry/*/*/*.toml",
    "data/compatibility/records/*.toml",
    "data/scratch-contracts/*/README.md",
    "data/scratch-contracts/*/schema.json",
    "data/scratch-contracts/*/fixtures/*.json",
    "data/scratch-contracts/*/fixtures/invalid/*.json",
    "data/schemas/*.json",
    "data/schemas/fixtures/*.json",
    "data/schemas/TOOLING-LICENSE",
    "data/schemas/RELEASE-MANIFEST-NOTICE_ja.md",
]
