services:
  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: volume
        source: caddy-data
        target: /data
      - type: volume
        source: caddy-config
        target: /config
      - type: bind
        source: ./wirescope
        target: /srv/wirescope
        read_only: true
    networks:
      - edge
      - app

  scratch:
    image: ghcr.io/naohiro2g/mc-remote-scratch:v2321.1.0
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./runtime/scratch.json
        target: /usr/share/nginx/html/mc-remote-runtime-config.json
        read_only: true
    networks:
      - app

  bridge:
    image: ghcr.io/naohiro2g/mc-remote-bridge:v2321.0.0
    restart: unless-stopped
    environment:
      BRIDGE_WS_HOST: 0.0.0.0
      BRIDGE_WS_PORT: "8080"
      BRIDGE_ORIGIN_ALLOWLIST: https://scratch.example.org
      BRIDGE_SANDBOX_ALLOWLIST: unity-sb.example.org
      BRIDGE_DEFAULT_SANDBOX: unity-sb.example.org
      BRIDGE_SANDBOX_PORT: "25585"
    networks:
      - app

  unity-sandbox:
    image: ghcr.io/naohiro2g/mc-remote-unity-sandbox:v2321.2.0
    restart: unless-stopped
    networks:
      app:
        aliases:
          - unity-sb.example.org

networks:
  app:
    internal: true
    enable_ipv6: false
  edge:
    internal: false
    enable_ipv6: false

volumes:
  caddy-data: {}
  caddy-config: {}
