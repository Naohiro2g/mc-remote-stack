# REVIEW TEMPLATE ONLY. This file is not a bundled preset and must not be used
# by resolve. Replace every <...> value in a reviewed preset-registry change.
# The exact-set change must also append this reviewed tuple in apply.py:
# BOOTSTRAP_CONTRACT = ["home-server@5", "<EXACT_PRESET_REF>", "dev", "lan-only", "integration"]

schema_version = 1

[preset]
name = "<EXACT_PRESET_NAME>"
revision = "<APPEND_ONLY_REVISION>"
description = "Exact normal-dev compatibility set approved by the gate coordinator"

[requirements]
profile_capabilities = [
  "compose",
  "paper",
  "persistent-world",
  "credential-rollback-separated",
  "mcremote-auth-enforced",
  "mcremote-session-only",
]
allowed_channels = ["dev"]
required_claims = ["profile-render", "protocol-hello"]

[[components]]
id = "minecraft-runtime"
role = "minecraft-runtime"
artifact = "minecraft-image"

[[components]]
id = "paper-server"
role = "paper-server"
artifact = "paper-jar"
minecraft_version = "<REVIEWED_MINECRAFT_VERSION>"

[[components]]
id = "mcremote-paper"
role = "mcremote-plugin"
artifact = "mcremote-jar"
protocol = "<REVIEWED_PROTOCOL_VERSION>"

[[artifacts]]
id = "minecraft-image"
kind = "oci"
version = "<REVIEWED_RUNTIME_VERSION>"
locator = "<REVIEWED_OCI_LOCATOR>"
digest = "sha256:<REVIEWED_OCI_MANIFEST_SHA256>"

[[artifacts]]
id = "paper-jar"
kind = "https-file"
version = "<REVIEWED_PAPER_VERSION>"
filename = "<REVIEWED_PAPER_FILENAME>"
sha256 = "<REVIEWED_PAPER_SHA256>"
origin = "<REVIEWED_CREDENTIAL_FREE_HTTPS_ORIGIN>"

[[artifacts]]
id = "mcremote-jar"
kind = "git-build"
version = "<REVIEWED_MCREMOTE_VERSION>"
repository = "<REVIEWED_HTTPS_REPOSITORY>"
commit = "<REVIEWED_FULL_COMMIT_SHA>"
source_subdirectory = "<REVIEWED_SOURCE_SUBDIRECTORY>"
recipe = "<REVIEWED_BUILD_RECIPE>"
recipe_sha256 = "<REVIEWED_RECIPE_SHA256>"
toolchain = "<REVIEWED_TOOLCHAIN_IDENTITY>"
toolchain_sha256 = "<REVIEWED_TOOLCHAIN_SHA256>"
build_input_sha256 = "<REVIEWED_BUILD_INPUT_SHA256>"
output_filename = "<REVIEWED_OUTPUT_FILENAME>"
output_sha256 = "<REVIEWED_OUTPUT_SHA256>"
