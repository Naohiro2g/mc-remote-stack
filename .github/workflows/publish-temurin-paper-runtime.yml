name: Publish Temurin Paper runtime

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the pinned build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify Temurin 25.0.5+8 JRE
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/temurin-paper-runtime"
          archive="$RUNNER_TEMP/OpenJDK25U-jre_x64_linux_hotspot_25.0.5_8.tar.gz"
          mkdir -p "$context/runtime"
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jre_x64_linux_hotspot_25.0.5_8.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '6fac98f0c8202efc3135a9e9e42aa61963ec42d1c5cbb40caf231e7b14a24ef6' \
            "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --strip-components=1 --directory "$context/runtime"
          cp containers/temurin-paper-runtime/Dockerfile "$context/Dockerfile"
          cp containers/temurin-paper-runtime/.dockerignore "$context/.dockerignore"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/temurin-paper-runtime
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/naohiro2g/mc-remote-paper-runtime-temurin:temurin-25.0.5-8

      - name: Report published identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published ghcr.io/naohiro2g/mc-remote-paper-runtime-temurin@${IMAGE_DIGEST}"
