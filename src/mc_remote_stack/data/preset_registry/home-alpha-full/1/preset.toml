schema_version = 1

[preset]
name = "home-alpha-full"
revision = "1"
description = "home private alpha full stack (Caddy/Scratch/Bridge/Minecraft): McRemote main HEAD 4e8f1ff1 and scratch-editor develop HEAD 5df50144, which currently coincide with the public-web-paper@8 (b6) tagged content. Caddy/itzg-minecraft/Paper stay pinned to the same known-good third-party artifacts already verified in public-web-paper@8."

[requirements]
profile_capabilities = [
  "compose",
  "paper",
  "persistent-world",
  "scratch-runtime",
  "websocket-bridge",
  "mcremote-auth-enforced",
]
allowed_channels = ["alpha"]
required_claims = ["profile-render", "protocol-hello"]

[[components]]
id = "caddy"
role = "caddy-edge"
artifact = "caddy-image"

[[components]]
id = "scratch"
role = "scratch-runtime"
artifact = "scratch-image"

[[components]]
id = "bridge"
role = "websocket-bridge"
artifact = "bridge-image"
protocol = "23.0.0"

[[components]]
id = "minecraft-runtime"
role = "minecraft-runtime"
artifact = "minecraft-image"

[[components]]
id = "paper-server"
role = "paper-server"
artifact = "paper-jar"
minecraft_version = "1.21.11"

[[components]]
id = "mcremote-paper"
role = "mcremote-plugin"
artifact = "mcremote-jar"
protocol = "23.0.0"

