schema_version = 1

[preset]
name = "public-web-paper"
revision = "9"
description = "Exact public b7 deployment set using owner-published Scratch and Bridge images, owner-built WireScope bytes, and the McRemote b7 release JAR"

[requirements]
profile_capabilities = [
  "compose",
  "paper",
  "persistent-world",
  "public-web",
  "scratch-runtime",
  "websocket-bridge",
  "wirescope-browser",
  "mcremote-auth-enforced",
  "mcremote-session-only",
]
allowed_channels = ["beta"]
required_claims = [
  "profile-render",
  "protocol-hello",
  "https-runtime",
  "websocket-bridge",
  "wirescope-public-handoff",
]

