schema_version = 1

[preset]
name = "public-web-paper"
revision = "8"
description = "Exact public beta b6 artifacts: sign, pickaxe_poke, mcr_eh_ entity handles, Scratch browser save, and a corrected Scratch footer/notice version label"

[requirements]
profile_capabilities = [
  "compose",
  "paper",
  "persistent-world",
  "public-web",
  "scratch-runtime",
  "websocket-bridge",
  "wirescope-browser",
  "mcremote-auth-enforced",
  "mcremote-session-only",
]
allowed_channels = ["beta"]
required_claims = [
  "profile-render",
  "protocol-hello",
  "https-runtime",
  "websocket-bridge",
  "wirescope-public-handoff",
]

[presentation.scratch_release_notice]
heading = "マイクラリモコンScratchクライアント ver.2300.0.0b6"
body = "リリース情報は「こちら」。"

[presentation.scratch_release_notice.link]
href = "https://github.com/Naohiro2g/scratch-editor/releases#release-v2300.0.0b6"
label = "こちら"

