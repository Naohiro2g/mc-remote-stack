schema_version = 1

[preset]
name = "public-web-paper"
revision = "2"
description = "Exact public beta b3 Scratch, Bridge, Paper, and McRemote artifacts"

[requirements]
profile_capabilities = [
  "compose",
  "paper",
  "persistent-world",
  "public-web",
  "scratch-runtime",
  "websocket-bridge",
  "mcremote-auth-enforced",
  "mcremote-session-only",
]
allowed_channels = ["beta"]
required_claims = [
  "profile-render",
  "protocol-hello",
  "https-runtime",
  "websocket-bridge",
]

