[requirements]
profile_capabilities = [
  "compose",
  "paper",
  "persistent-world",
  "public-web",
  "scratch-runtime",
  "websocket-bridge",
  "wirescope-browser",
  "mcremote-auth-enforced",
  "mcremote-session-only",
]
