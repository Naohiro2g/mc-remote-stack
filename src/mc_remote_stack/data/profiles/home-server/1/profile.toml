schema_version = 1

[profile]
name = "home-server"
revision = "1"
description = "Single-host Compose topology for an isolated or LAN-only Paper integration server"

[capabilities]
provided = ["compose", "paper", "persistent-world"]
required_component_roles = ["minecraft-runtime", "paper-server", "mcremote-plugin"]

[environment]
allowed_channels = ["beta", "alpha"]
allowed_exposures = ["isolated", "lan-only"]
allowed_purposes = ["integration"]

[policy]
required_security_controls = ["online-mode", "rcon-disabled"]
instance_fields = [
  "deployment.name",
  "environment.identity",
  "runtime.artifact_store",
  "runtime.volumes",
  "world.identity",
  "network.bind_address",
  "network.java_port",
  "network.mcremote_port",
  "agreements.minecraft_eula",
]
override_allowlist = ["capacity.memory"]

[renderer]
name = "compose"
revision = "1"

[[services]]
id = "minecraft"
role = "minecraft"

[[volume_roles]]
id = "minecraft-data"
kind = "world"
