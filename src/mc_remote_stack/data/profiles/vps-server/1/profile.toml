schema_version = 1

[profile]
name = "vps-server"
revision = "1"
description = "Single-host public VPS Compose topology for an exact Minecraft and McRemote runtime"

[capabilities]
provided = ["compose", "paper", "persistent-world"]
required_component_roles = ["minecraft-runtime", "paper-server", "mcremote-plugin"]

[environment]
allowed_channels = ["beta"]
allowed_exposures = ["public"]
allowed_purposes = ["integration"]

[policy]
required_security_controls = [
  "online-mode",
  "rcon-disabled",
  "explicit-public-bind",
  "host-firewall-reviewed",
]
instance_fields = [
  "deployment.name",
  "environment.identity",
  "runtime.artifact_store",
  "runtime.volumes",
  "world.identity",
  "network.bind_address",
  "network.java_port",
  "network.mcremote_port",
  "agreements.minecraft_eula",
]
override_allowlist = ["capacity.memory"]

[renderer]
name = "compose"
revision = "1"

[[operator_input_roles]]
id = "minecraft-motd"
adapter = "minecraft-motd@1"
required = false

[[services]]
id = "minecraft"
role = "minecraft"

[[volume_roles]]
id = "minecraft-data"
kind = "world"
