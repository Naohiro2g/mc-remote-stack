schema_version = 1

[profile]
name = "vps-server"
revision = "8"
description = "Public VPS b4 topology with writable session persistence and fail-closed Scratch targets"

[capabilities]
provided = [
  "compose",
  "paper",
  "persistent-world",
  "public-web",
  "scratch-runtime",
  "websocket-bridge",
  "mcremote-auth-enforced",
  "mcremote-session-only",
]
required_component_roles = [
  "caddy-edge",
  "scratch-runtime",
  "websocket-bridge",
  "minecraft-runtime",
  "paper-server",
  "mcremote-plugin",
]

[environment]
allowed_channels = ["beta"]
allowed_exposures = ["public"]
allowed_purposes = ["integration"]

[policy]
required_security_controls = [
  "online-mode",
  "rcon-disabled",
  "explicit-public-bind",
  "host-firewall-reviewed",
  "edge-backend-port-isolation",
  "origin-allowlist",
  "ipv4-only-publication",
  "explicit-minecraft-egress",
  "typed-minecraft-server-settings",
  "mcremote-auth-enforced",
  "mcremote-session-only",
]
instance_fields = [
  "deployment.name",
  "environment.identity",
  "runtime.artifact_store",
  "runtime.volumes",
  "world.identity",
  "network.bind_address",
  "network.java_port",
  "network.mcremote_port",
  "agreements.minecraft_eula",
]
override_allowlist = ["capacity.memory"]

[renderer]
name = "compose"
revision = "10"

[[operator_input_roles]]
id = "public-routes"
adapter = "public-routes@1"
required = true

[[operator_input_roles]]
id = "minecraft-server"
adapter = "minecraft-server@1"
required = true

[[operator_input_roles]]
id = "connection-targets"
adapter = "connection-targets@1"
required = true

[[services]]
id = "caddy"
role = "caddy-edge"

[[services]]
id = "scratch"
role = "scratch-runtime"

[[services]]
id = "bridge"
role = "websocket-bridge"

[[services]]
id = "minecraft"
role = "minecraft"

[[volume_roles]]
id = "minecraft-data"
kind = "world"

[[volume_roles]]
id = "caddy-data"
kind = "runtime-data"

[[volume_roles]]
id = "caddy-config"
kind = "runtime-data"
